<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skaner paragonów</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">

  <script src="config.js"></script>
</head>

<body onload="initApp()">

  <!-- CAMERA -->
  <div id="cameraView" class="view">
    <video id="camera" autoplay playsinline></video>

    <div class="controls">
      <button onclick="toggleTorch()">🔦</button>
      <button onclick="takePhoto()">📷</button>
    </div>
  </div>

  <!-- EDIT -->
  <div id="editView" class="view hidden">
    <canvas id="canvas"></canvas>

    <div class="controls">
      <button onclick="rotateLeft()">↺</button>
      <input type="range" min="-10" max="10" step="0.1"
             value="0"
             oninput="setFineRotation(this.value)">
      <button onclick="rotateRight()">↻</button>
    </div>

    <div class="controls bottom">
      <button onclick="retake()">↩</button>
      <button onclick="confirm()">✓</button>
    </div>
  </div>

  <!-- UPLOAD -->
  <div id="uploadView" class="view hidden">
    <p>Wysyłanie...</p>
  </div>

  <div id="status"></div>
  <div id="version"></div>
  <div id="resolution"></div>

  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
