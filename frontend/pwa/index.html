<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skaner paragonów</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">

  <script src="config.js"></script>
</head>

<body>
  <h1>Receipt Analyzer</h1>
  
  <div id="appInfo">
    <div id="resolution"></div>
    <div id="version"></div>
  </div>

  <!-- CAMERA -->
  <div id="cameraView" class="view">
    <div class="cameraContainer">
      <video id="camera" autoplay playsinline></video>
    </div>

    <div class="controlsContainer">
      <button id="torchButton">🔦</button>
      <button id="takePhotoButton">📷</button>
    </div>
  </div>

  <!-- EDIT -->
  <div id="editView" class="view hidden">
    <div class="cameraContainer">
      <canvas id="canvas"></canvas>
    </div>      

    <div class="controlsContainer">
      <div>
        <input id="fineRotationSlider" type="range" min="-45" max="45" step="0.1" value="0">
      </div>
      <div>
        <button id="retakeButton">↩</button>
        <button id="rotateLeftButton">↺</button>
        <button id="rotateRightButton">↻</button>
        <button id="confirmButton">✓</button>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="app.js?v=__VERSION__"></script>
</body>
</html>
